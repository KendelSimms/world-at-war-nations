name: Build Forge 1.20.1 mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Make Gradle bootstrap executable
        run: chmod +x ./gradlew
      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version
      - name: Build mod JAR
        run: ./gradlew build --no-daemon
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: world-at-war-nations-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Attach JAR to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
